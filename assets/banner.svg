<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="CAPT. COM Wilmer Buestan — Software Engineer, Cybersecurity, Electronic Warfare">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1d2b1a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#39ff6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#39ff6a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff6a" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#39ff6a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code','DejaVu Sans Mono',Consolas,monospace}
      .sweep{transform-origin:1010px 160px;animation:spin 4s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .blip{animation:blip 4s ease-out infinite;opacity:0}
      .b2{animation-delay:1.3s}.b3{animation-delay:2.6s}
      @keyframes blip{0%{opacity:0}8%{opacity:1}60%{opacity:0}100%{opacity:0}}
      .bar{transform-box:fill-box;transform-origin:bottom;animation:eq 1.6s ease-in-out infinite alternate}
      @keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
      .cursor{animation:bl 1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
      .scanline{animation:sl 6s linear infinite}
      @keyframes sl{from{transform:translateY(-120px)}to{transform:translateY(320px)}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="#0a0f09"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect class="scanline" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>

  <!-- classification bars -->
  <rect x="0" y="0" width="1200" height="22" fill="#12200f"/>
  <text x="600" y="15" text-anchor="middle" class="mono" font-size="11" fill="#9bd18f" letter-spacing="3">UNCLASSIFIED // PUBLIC PROFILE // REL TO GITHUB</text>
  <rect x="0" y="298" width="1200" height="22" fill="#12200f"/>
  <text x="24" y="313" class="mono" font-size="11" fill="#6f9a66" letter-spacing="1">GRID 00°13'S 078°31'W · QUITO, EC</text>
  <text x="1176" y="313" text-anchor="end" class="mono" font-size="11" fill="#6f9a66" letter-spacing="1">LINK: SECURE · STATUS: OPERATIONAL</text>

  <!-- HUD corners -->
  <g stroke="#39ff6a" stroke-width="2" fill="none" opacity="0.8">
    <path d="M20 44V34H30"/><path d="M1180 44V34H1170"/>
    <path d="M20 276V286H30"/><path d="M1180 276V286H1170"/>
  </g>

  <!-- identity -->
  <text x="56" y="78" class="mono" font-size="14" fill="#f2b84b" letter-spacing="4">CAPT. COM · EJÉRCITO DEL ECUADOR</text>
  <text x="54" y="138" class="mono" font-size="52" font-weight="700" fill="#e8ffe3" letter-spacing="2">WILMER BUESTAN</text>
  <rect x="56" y="154" width="520" height="2" fill="#39ff6a" opacity="0.6"/>
  <text x="56" y="186" class="mono" font-size="18" fill="#39ff6a">&gt; Software Engineer · Cybersecurity M.Sc.</text>
  <text x="56" y="214" class="mono" font-size="18" fill="#39ff6a">&gt; Electronic Warfare Analyst<tspan class="cursor">_</tspan></text>

  <!-- spectrum analyzer -->
  <g transform="translate(56 232)">
    <text x="0" y="0" class="mono" font-size="10" fill="#6f9a66" letter-spacing="2">SPECTRUM · 30 MHz — 6 GHz</text>
    <g transform="translate(0 50)" fill="#39ff6a">
      <rect class="bar" x="0"   y="-30" width="8" height="30" style="animation-delay:-.1s"/>
      <rect class="bar" x="12"  y="-18" width="8" height="18" style="animation-delay:-.7s"/>
      <rect class="bar" x="24"  y="-36" width="8" height="36" style="animation-delay:-.3s"/>
      <rect class="bar" x="36"  y="-22" width="8" height="22" style="animation-delay:-1.1s"/>
      <rect class="bar" x="48"  y="-40" width="8" height="40" style="animation-delay:-.5s"/>
      <rect class="bar" x="60"  y="-14" width="8" height="14" style="animation-delay:-.9s"/>
      <rect class="bar" x="72"  y="-28" width="8" height="28" style="animation-delay:-.2s"/>
      <rect class="bar" x="84"  y="-38" width="8" height="38" style="animation-delay:-1.3s"/>
      <rect class="bar" x="96"  y="-20" width="8" height="20" style="animation-delay:-.6s"/>
      <rect class="bar" x="108" y="-32" width="8" height="32" style="animation-delay:-1s"/>
      <rect class="bar" x="120" y="-16" width="8" height="16" style="animation-delay:-.4s"/>
      <rect class="bar" x="132" y="-26" width="8" height="26" style="animation-delay:-1.2s"/>
      <rect class="bar" x="144" y="-40" width="8" height="40" fill="#f2b84b" style="animation-delay:-.8s"/>
      <rect class="bar" x="156" y="-24" width="8" height="24" style="animation-delay:-.15s"/>
      <rect class="bar" x="168" y="-12" width="8" height="12" style="animation-delay:-1.4s"/>
      <rect class="bar" x="180" y="-30" width="8" height="30" style="animation-delay:-.35s"/>
      <rect class="bar" x="192" y="-20" width="8" height="20" style="animation-delay:-.95s"/>
      <rect class="bar" x="204" y="-34" width="8" height="34" style="animation-delay:-.55s"/>
      <rect class="bar" x="216" y="-18" width="8" height="18" style="animation-delay:-1.15s"/>
      <rect class="bar" x="228" y="-26" width="8" height="26" style="animation-delay:-.25s"/>
    </g>
  </g>

  <!-- radar -->
  <circle cx="1010" cy="160" r="118" fill="url(#glow)"/>
  <g fill="none" stroke="#39ff6a" stroke-opacity="0.35">
    <circle cx="1010" cy="160" r="118"/><circle cx="1010" cy="160" r="88"/>
    <circle cx="1010" cy="160" r="58"/><circle cx="1010" cy="160" r="28"/>
    <path d="M892 160H1128M1010 42V278"/>
  </g>
  <g class="sweep">
    <path d="M1010 160L1128 160A118 118 0 0 0 1093.4 76.6Z" fill="url(#beam)" opacity="0.8"/>
    <path d="M1010 160L1128 160" stroke="#39ff6a" stroke-width="2"/>
  </g>
  <circle class="blip"    cx="1062" cy="118" r="4" fill="#f2b84b"/>
  <circle class="blip b2" cx="958"  cy="206" r="4" fill="#39ff6a"/>
  <circle class="blip b3" cx="1048" cy="222" r="3" fill="#ff5d5d"/>
  <text x="1010" y="296" text-anchor="middle" class="mono" font-size="10" fill="#6f9a66" letter-spacing="2">EW · SIGINT · CYBER</text>
</svg>
